[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodidact-agent"
version = "0.1.0"
description = "A persistent self-learning agent with beliefs, evidence, disputes, memory and model-agnostic cognition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.29,<1",
  "pgvector>=0.3.5,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.8,<15",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
documents = ["pypdf>=5,<7"]
packaging = ["pyinstaller>=6,<7"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
autodidact = "autodidact.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autodidact"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "autodidact/_resources/alembic.ini"
"migrations" = "autodidact/_resources/migrations"
"config/agent.yaml" = "autodidact/_resources/config/agent.yaml"
".env.example" = "autodidact/_resources/.env.example"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
